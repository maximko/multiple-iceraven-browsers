name: Build IceRaven APKs

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream tag, branch, commit, or latest-release
        required: true
        default: latest-release
      variants:
        description: Comma-separated variant ids, or all
        required: true
        default: all

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      release_name: ${{ steps.metadata.outputs.release_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      upstream_ref: ${{ steps.metadata.outputs.upstream_ref }}

    steps:
      - name: Checkout orchestration repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve release metadata
        id: metadata
        env:
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        run: python3 scripts/release_metadata.py --ref "$REQUESTED_REF"

      - name: Build APK variants
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=1g -Xms512m -Xmx4g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr" -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false
          SELECTED_VARIANTS: ${{ inputs.variants }}
          UPSTREAM_REF: ${{ steps.metadata.outputs.upstream_ref }}
        run: |
          set -o pipefail
          mkdir -p logs
          python3 scripts/build-variants.py \
            --ref "$UPSTREAM_REF" \
            --variants "$SELECTED_VARIANTS" 2>&1 | tee logs/build.log

      - name: Upload unsigned build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-iceraven-${{ github.run_id }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-debug
          path: |
            logs/*.log
            .work/iceraven-browser/build/reports/**
            .work/iceraven-browser/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

  sign-and-publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout orchestration repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download unsigned build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-iceraven-${{ github.run_id }}
          path: artifacts

      - name: Sign APK artifacts
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: python3 scripts/sign-apks.py

      - name: Upload APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iceraven-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ${{ needs.build.outputs.release_name }}
          body: |
            Upstream IceRaven: ${{ needs.build.outputs.upstream_ref }}

            APKs are signed with this repository's persistent signing key and built for arm64-v8a.
          files: artifacts/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: false
