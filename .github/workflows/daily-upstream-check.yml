name: Daily upstream IceRaven check

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Build even if the latest tag was already recorded
        required: true
        type: boolean
        default: false
      variants:
        description: Comma-separated variant ids, or all
        required: true
        default: all

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.upstream.outputs.latest_tag }}
      should_build: ${{ steps.upstream.outputs.should_build }}

    steps:
      - name: Checkout orchestration repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore build state
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --depth=1 origin state
            git show origin/state:latest-upstream-tag.txt > state/latest-upstream-tag.txt || true
          fi

      - name: Check latest upstream release
        id: upstream
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          FORCE=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_REBUILD" = "true" ]; then
            FORCE="--force"
          fi
          python3 scripts/check-upstream.py $FORCE

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      release_name: ${{ steps.metadata.outputs.release_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      upstream_ref: ${{ steps.metadata.outputs.upstream_ref }}

    steps:
      - name: Checkout orchestration repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve release metadata
        id: metadata
        env:
          REQUESTED_REF: ${{ needs.check.outputs.latest_tag }}
        run: python3 scripts/release_metadata.py --ref "$REQUESTED_REF"

      - name: Build APK variants
        env:
          EVENT_NAME: ${{ github.event_name }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=1g -Xms512m -Xmx4g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr" -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false
          REQUESTED_VARIANTS: ${{ inputs.variants }}
          UPSTREAM_REF: ${{ steps.metadata.outputs.upstream_ref }}
        run: |
          set -o pipefail
          mkdir -p logs
          VARIANTS="all"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VARIANTS="$REQUESTED_VARIANTS"
          fi
          python3 scripts/build-variants.py \
            --ref "$UPSTREAM_REF" \
            --variants "$VARIANTS" 2>&1 | tee logs/build.log

      - name: Upload unsigned build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-iceraven-${{ github.run_id }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-debug-${{ github.run_id }}
          path: |
            logs/*.log
            .work/iceraven-browser/build/reports/**
            .work/iceraven-browser/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

  sign-and-publish:
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout orchestration repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download unsigned build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-iceraven-${{ github.run_id }}
          path: artifacts

      - name: Sign APK artifacts
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: python3 scripts/sign-apks.py

      - name: Upload APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iceraven-${{ github.run_id }}-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ${{ needs.build.outputs.release_name }}
          body: |
            Upstream IceRaven: ${{ needs.build.outputs.upstream_ref }}

            APKs are signed with this repository's persistent signing key and built for arm64-v8a.
          files: artifacts/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: false

      - name: Record built upstream tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ needs.build.outputs.upstream_ref }}
        run: |
          tmpdir="$(mktemp -d)"
          git init --initial-branch=state "$tmpdir"
          cd "$tmpdir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --depth=1 origin state
            git checkout state
          else
            git checkout --orphan state
          fi
          printf '%s\n' "$UPSTREAM_REF" > latest-upstream-tag.txt
          git add latest-upstream-tag.txt
          git diff --cached --quiet || git commit -m "Record built IceRaven $UPSTREAM_REF"
          git push origin state
